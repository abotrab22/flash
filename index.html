<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="احسب سعر الأقساط من السعر النقدي.">
  <title>حاسبة الأقساط</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: #f5f7fb;
      color: #17233c;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-tap-highlight-color: transparent;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% -18%, rgba(84, 111, 240, .13), transparent 58%),
        #f5f7fb;
    }

    button, input { font: inherit; }
    button { touch-action: manipulation; }

    .app {
      width: min(100%, 520px);
      min-height: 100vh;
      min-height: 100dvh;
      margin-inline: auto;
      padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    header { padding: 18px 2px 24px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #5869c9;
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .01em;
    }

    .eyebrow-mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6678ed;
      box-shadow: 0 0 0 4px #e6e9ff;
    }

    h1 {
      margin: 10px 0 5px;
      font-size: clamp(1.7rem, 8vw, 2.2rem);
      font-weight: 850;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 0;
      color: #73809a;
      font-size: .94rem;
      line-height: 1.7;
    }

    main { display: grid; gap: 16px; }

    .panel {
      border: 1px solid #e8ebf3;
      border-radius: 22px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 10px 30px rgba(32, 48, 88, .055);
    }

    .calculator { padding: 22px; }

    .device-field {
      min-width: 0;
      margin: 0 0 20px;
      padding: 0;
      border: 0;
    }

    .device-field legend {
      margin-bottom: 10px;
      font-size: .91rem;
      font-weight: 750;
    }

    .device-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .device-option {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 9px;
      border: 1.5px solid #dfe4ef;
      border-radius: 13px;
      background: #fbfcfe;
      color: #69758d;
      font-size: .84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .device-option:has(input:checked) {
      border-color: #6678ed;
      background: #f1f3ff;
      color: #4657bd;
    }

    .device-option input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #5369dc;
    }

    .device-option:focus-within {
      outline: 3px solid rgba(102, 120, 237, .2);
      outline-offset: 2px;
    }

    .field-heading, .installment-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    label, .section-title {
      font-size: .91rem;
      font-weight: 750;
    }

    .term-badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: #edf8f3;
      color: #16835d;
      font-size: .77rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .amount-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding: 0 15px;
      min-height: 66px;
      border: 1.5px solid #dfe4ef;
      border-radius: 16px;
      background: #fbfcfe;
      transition: border-color .18s, box-shadow .18s;
    }

    .amount-wrap:focus-within {
      border-color: #6678ed;
      box-shadow: 0 0 0 4px rgba(102, 120, 237, .12);
    }

    .amount-wrap input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #17233c;
      font-size: 1.45rem;
      font-weight: 800;
      direction: ltr;
      text-align: right;
    }

    .amount-wrap input::placeholder { color: #b6bfd0; }

    .amount-unit {
      flex: 0 0 auto;
      color: #8993a8;
      font-size: .8rem;
      font-weight: 700;
    }

    .helper {
      min-height: 1.35em;
      margin: 8px 2px 0;
      color: #8993a8;
      font-size: .75rem;
    }

    .helper.error { color: #c43d4d; }

    .installment-row { margin-top: 22px; }

    .result {
      position: relative;
      overflow: hidden;
      padding: 22px;
      border: 0;
      background: linear-gradient(140deg, #5369dc 0%, #4657bd 100%);
      color: white;
      box-shadow: 0 16px 34px rgba(72, 91, 195, .23);
    }

    .result::after {
      position: absolute;
      top: -76px;
      left: -52px;
      width: 190px;
      height: 190px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 50%;
      box-shadow: 0 0 0 24px rgba(255,255,255,.035), 0 0 0 49px rgba(255,255,255,.025);
      content: "";
      pointer-events: none;
    }

    .result-label {
      position: relative;
      z-index: 1;
      color: #e0e5ff;
      font-size: .85rem;
      font-weight: 650;
    }

    .total {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 6px;
      font-size: clamp(2.35rem, 12vw, 3.25rem);
      font-weight: 850;
      letter-spacing: -.045em;
      line-height: 1.2;
      overflow-wrap: anywhere;
      direction: ltr;
      text-align: right;
    }

    .total-unit {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 3px;
      color: #d7ddff;
      font-size: .77rem;
    }

    .divider {
      position: relative;
      z-index: 1;
      height: 1px;
      margin: 18px 0 14px;
      background: rgba(255,255,255,.2);
    }

    .breakdown {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .breakdown-item span {
      display: block;
      color: #d7ddff;
      font-size: .73rem;
    }

    .breakdown-item strong {
      display: block;
      margin-top: 4px;
      font-size: 1.05rem;
      font-weight: 750;
      direction: ltr;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .monthly {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
    }

    .monthly-copy { min-width: 0; }
    .monthly-copy span { display: block; color: #7a869e; font-size: .77rem; }
    .monthly-copy strong { display: block; margin-top: 4px; font-size: .96rem; }

    .monthly-amount {
      flex: 0 0 auto;
      color: #16835d;
      font-size: 1.16rem;
      font-weight: 850;
      direction: ltr;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .note {
      margin: 0;
      color: #8993a8;
      font-size: .75rem;
      line-height: 1.7;
      text-align: center;
    }

    .reset {
      align-self: center;
      min-height: 44px;
      padding: 8px 16px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #69758d;
      font-size: .84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .reset:active { background: #e9ecf4; }

    @media (max-width: 370px) {
      .app { padding-inline: 14px; }
      .calculator, .result { padding: 18px; }
      .monthly { padding-inline: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <span class="eyebrow"><span class="eyebrow-mark" aria-hidden="true"></span>حاسبة بيع بالتقسيط</span>
      <h1>من النقد إلى الأقساط</h1>
      <p class="subtitle">أدخل السعر النقدي لمعرفة سعر الأقساط وقيمة القسط.</p>
    </header>

    <main>
      <section class="panel calculator" aria-label="مدخلات الحاسبة">
        <fieldset class="device-field">
          <legend>نوع الجهاز</legend>
          <div class="device-options">
            <label class="device-option">
              <input type="radio" name="deviceType" value="mobile">
              موبايل
            </label>
            <label class="device-option">
              <input type="radio" name="deviceType" value="other" checked>
              باقي الأجهزة
            </label>
          </div>
        </fieldset>
        <div class="field-heading">
          <label for="cashPrice">السعر النقدي</label>
          <span class="term-badge">١٠ أشهر</span>
        </div>
        <div class="amount-wrap">
          <input id="cashPrice" type="text" inputmode="decimal" autocomplete="off" placeholder="مثال: ١٠٠٬٠٠٠" aria-describedby="priceHelp" aria-label="السعر النقدي">
          <span class="amount-unit">د.ع.</span>
        </div>
        <p class="helper" id="priceHelp" aria-live="polite">أدخل السعر بالدينار العراقي.</p>

        <div class="installment-row">
          <div class="installment-heading">
            <span class="section-title">مدة التقسيط</span>
            <span class="term-badge">١٠ أقساط متساوية</span>
          </div>
        </div>
      </section>

      <section class="panel result" aria-label="نتيجة الحساب" aria-live="polite" aria-atomic="true">
        <span class="result-label">سعر الأقساط الإجمالي</span>
        <strong class="total" id="installmentPrice">—</strong>
        <span class="total-unit">مقرب لأقرب ١٠٬٠٠٠ دينار عراقي</span>
        <div class="divider"></div>
        <div class="breakdown">
          <div class="breakdown-item">
            <span>السعر النقدي</span>
            <strong id="cashSummary">—</strong>
          </div>
          <div class="breakdown-item">
            <span>قيمة الإضافة</span>
            <strong id="increaseAmount">—</strong>
          </div>
        </div>
      </section>

      <section class="panel monthly" aria-label="قيمة القسط">
        <div class="monthly-copy">
          <strong>القسط الشهري التقريبي</strong>
          <span id="monthlyCaption">على ١٠ أشهر</span>
        </div>
        <strong class="monthly-amount" id="monthlyAmount">—</strong>
      </section>

      <p class="note" id="pricingNote" aria-live="polite"></p>
      <button class="reset" id="reset" type="button">مسح الحاسبة</button>
    </main>
  </div>

  <script>
    (() => {
      const RATES = { mobile: 0.3, other: 0.2 };
      const INSTALLMENT_COUNT = 10;
      const ROUNDING_UNIT = 10000;
      const digits = new Map([
        ...[...'٠١٢٣٤٥٦٧٨٩'].map((digit, index) => [digit, String(index)]),
        ...[...'۰۱۲۳۴۵۶۷۸۹'].map((digit, index) => [digit, String(index)])
      ]);
      const numberFormat = new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
      const cashInput = document.querySelector('#cashPrice');
      const helper = document.querySelector('#priceHelp');
      const priceOutput = document.querySelector('#installmentPrice');
      const cashOutput = document.querySelector('#cashSummary');
      const increaseOutput = document.querySelector('#increaseAmount');
      const monthlyOutput = document.querySelector('#monthlyAmount');
      const pricingNote = document.querySelector('#pricingNote');
      const deviceInputs = document.querySelectorAll('input[name="deviceType"]');

      function parseAmount(value) {
        let normalized = [...value.trim()].map(character => digits.get(character) ?? character).join('');
        normalized = normalized.replace(/[٬\s]/g, '');

        if (normalized.includes(',') && normalized.includes('.')) {
          normalized = normalized.replace(/,/g, '');
        } else if (/^\d{1,3}(,\d{3})+$/.test(normalized)) {
          normalized = normalized.replace(/,/g, '');
        } else {
          normalized = normalized.replace(/[,٫]/g, '.');
        }

        if (!/^\d+(?:\.\d{0,2})?$/.test(normalized)) return null;
        const amount = Number(normalized);
        return Number.isFinite(amount) ? amount : null;
      }

      function formatAmount(amount) {
        return `${numberFormat.format(amount)} د.ع.`;
      }

      function update() {
        const deviceType = document.querySelector('input[name="deviceType"]:checked').value;
        const rate = RATES[deviceType];
        pricingNote.textContent = `يُضاف ${numberFormat.format(rate * 100)}٪ إلى السعر النقدي، ثم يُقرّب الإجمالي لأقرب ١٠٬٠٠٠ دينار عراقي.`;

        const cashPrice = parseAmount(cashInput.value);
        const hasPrice = cashInput.value.trim().length > 0;
        const validPrice = cashPrice !== null && cashPrice > 0;
        const messages = [];

        cashInput.setAttribute('aria-invalid', String(hasPrice && !validPrice));
        if (hasPrice && !validPrice) messages.push('أدخل مبلغاً صحيحاً أكبر من صفر وبحد أقصى منزلتين عشريتين.');
        helper.textContent = messages.length
          ? messages.join(' ')
          : 'أدخل السعر بالدينار العراقي.';
        helper.classList.toggle('error', messages.length > 0);

        const canCalculate = validPrice;
        [priceOutput, cashOutput, increaseOutput, monthlyOutput].forEach(output => {
          output.textContent = canCalculate ? '' : '—';
        });
        if (!canCalculate) return;

        const totalBeforeRounding = cashPrice * (1 + rate);
        const total = Math.round((totalBeforeRounding + Number.EPSILON) / ROUNDING_UNIT) * ROUNDING_UNIT;
        const increase = Math.round((total - cashPrice + Number.EPSILON) * 100) / 100;
        const monthly = Math.round((total / INSTALLMENT_COUNT + Number.EPSILON) * 100) / 100;

        priceOutput.textContent = formatAmount(total);
        cashOutput.textContent = formatAmount(cashPrice);
        increaseOutput.textContent = formatAmount(increase);
        monthlyOutput.textContent = formatAmount(monthly);
      }

      cashInput.addEventListener('input', update);
      deviceInputs.forEach(input => input.addEventListener('change', update));
      document.querySelector('#reset').addEventListener('click', () => {
        cashInput.value = '';
        update();
        cashInput.focus();
      });

      update();
    })();
  </script>
</body>
</html>
